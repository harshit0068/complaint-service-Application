spring.application.name=user-service
server.port=8082
spring.datasource.url=${HOSTELFIX_DB_URL:jdbc:mysql://localhost:3306/hostelfix}
spring.datasource.username=${HOSTELFIX_DB_USER:root}
spring.datasource.password=${HOSTELFIX_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
hostelfix.jwt.secret=${HOSTELFIX_JWT_SECRET:local-development-only-secret-change-before-deployment}
hostelfix.internal-secret=${HOSTELFIX_INTERNAL_SECRET:local-internal-secret-change-before-deployment}
