spring.application.name=complaint-service
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/hostelfix
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
hostelfix.jwt.secret=${HOSTELFIX_JWT_SECRET:local-development-only-secret-change-before-deployment}
hostelfix.internal-secret=${HOSTELFIX_INTERNAL_SECRET:local-internal-secret-change-before-deployment}
hostelfix.user-service-url=${HOSTELFIX_USER_SERVICE_URL:http://localhost:8082}
hostelfix.upload-dir=${HOSTELFIX_UPLOAD_DIR:uploads}